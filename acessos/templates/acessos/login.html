{% extends "acessos/base.html" %}
{% block titulo %}Entrar - Controle de Acessos{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Controle de Acessos</h1>
    <p>Entre com seu usuário e senha.</p>

    {% if form.errors %}
      <div class="alert alert-danger" role="alert">Usuário ou senha incorretos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
