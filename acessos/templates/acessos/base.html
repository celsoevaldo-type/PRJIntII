{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Controle de Acessos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'acessos/estilo.css' %}" rel="stylesheet">
</head>
<body>
  <!-- link escondido que aparece com o Tab: pula o menu e vai direto ao conteúdo -->
  <a href="#conteudo" class="pular-menu">Pular para o conteúdo</a>

  {% if user.is_authenticated %}
    {% include "acessos/menu.html" %}
  {% endif %}

  <main id="conteudo" class="container my-4">
    <!-- role="status" faz o leitor de tela anunciar a mensagem sozinho -->
    <div role="status" aria-live="polite">
      {% for msg in messages %}
        <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ msg }}</div>
      {% endfor %}
    </div>

    {% block conteudo %}{% endblock %}
  </main>

  <script src="{% static 'acessos/script.js' %}"></script>
</body>
</html>
